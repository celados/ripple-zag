name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm.celados.com
    runs-on: celados-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test -- --run

      - name: Verify release contract
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(bun -p "require('./package.json').version")"
          test "$(bun -p "require('./package.json').name")" = "@celados/ripple-zag"
          test "${{ github.event.release.tag_name }}" = "v$VERSION"
          cp .npmrc.ci .npmrc
          npm publish --dry-run --access public

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Verify clean consumer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(bun -p "require('./package.json').version")"
          CONSUMER_DIR="$(mktemp -d)"
          cp .npmrc.ci "$CONSUMER_DIR/.npmrc"
          cd "$CONSUMER_DIR"
          bun init -y
          bun add "@celados/ripple-zag@$VERSION"
          bun -e 'const pkg = await import("@celados/ripple-zag/package.json"); const api = await import("@celados/ripple-zag"); if (typeof api.useMachine !== "function" || typeof api.normalizeProps !== "object") process.exit(1); console.log(`${pkg.default.name}@${pkg.default.version} from https://npm.celados.com`)'
